<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Booster Rewards — Beckhaul Technologies</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;700&family=Archivo+Black&display=swap">
<style>
/* The standing Booster Rewards poster: 1080 x 1350, exported as a PNG.
   The artwork is fixed dark in every theme because it leaves here as an image. */
html, body { margin: 0; background: #0E1419; }
.scaler { width: 100%; max-width: 1080px; margin: 0 auto; overflow: hidden; }
.bd {
  width: 1080px; height: 1350px; box-sizing: border-box; padding: 72px;
  display: flex; flex-direction: column;
  font-family: 'Archivo', sans-serif; color: #FFFFFF; background: #0E1419;
  transform-origin: top left;
}
.top { display: flex; align-items: center; justify-content: space-between; gap: 24px; }
.logo { box-sizing: border-box; padding: 16px 22px; background: #FFFFFF; border-radius: 16px; flex: none; }
.logo img { display: block; width: 220px; height: 129px; object-fit: contain; }
.eyebrow { font-size: 26px; font-weight: 700; letter-spacing: 0.26em; color: #FFC20E; }
.headline {
  margin-top: 52px; font-family: 'Archivo Black', sans-serif;
  font-size: 96px; line-height: 0.98; letter-spacing: -0.02em;
}
.sub { margin-top: 24px; font-size: 34px; font-weight: 500; line-height: 1.25; color: #AEB9C6; }
.sub b { color: #FFFFFF; font-weight: 700; }
.tiers { margin-top: 52px; display: flex; flex-direction: column; }
.tier {
  height: 196px; box-sizing: border-box; display: flex; align-items: center;
  gap: 30px; padding-left: 24px; border-top: 2px solid #2A333D;
}
.tier:last-child { border-bottom: 2px solid #2A333D; }
.tier .meta { flex: 1; display: flex; flex-direction: column; gap: 6px; }
.tier .label { font-size: 26px; font-weight: 700; letter-spacing: 0.22em; }
.tier .num {
  font-family: 'Archivo Black', sans-serif; font-size: 68px; line-height: 1; letter-spacing: -0.02em;
}
.tier .unit { font-size: 26px; font-weight: 700; letter-spacing: 0.08em; color: #AEB9C6; }
.tier .amt {
  flex: none; text-align: right; font-family: 'Archivo Black', sans-serif;
  font-size: 106px; line-height: 1; letter-spacing: -0.03em;
}
.pill {
  font-size: 20px; font-weight: 700; letter-spacing: 0.16em;
  color: #0E1419; background: #7FD8F7; border-radius: 999px; padding: 5px 14px;
}
.labelrow { display: flex; align-items: center; gap: 14px; }
.foot { margin-top: auto; font-size: 28px; font-weight: 500; line-height: 1.3; color: #8D99A8; }
</style>
</head>
<body>
<div class="scaler" id="scaler">
<div class="bd" id="board">

  <div class="top">
    <div class="logo"><img src="../assets/beckhaul-logo.png" alt="Beckhaul Technologies"></div>
    <div class="eyebrow">DAILY BOOSTER</div>
  </div>

  <div class="headline">Hit your daily<br>meters target.</div>

  <div class="sub">Climb the tiers.<br><b>Operator</b> and <b>Tracker</b> each take home the full amount.</div>

  <div class="tiers">

    <div class="tier" style="border-left:6px solid #7FD8F7;background:linear-gradient(90deg,rgba(127,216,247,0.10),rgba(127,216,247,0))">
      <svg width="76" height="76" viewBox="0 0 24 24" aria-hidden="true" style="flex:none"><path d="M12 2.5 20.5 9 12 21.5 3.5 9z" fill="#7FD8F7"></path><path d="M3.5 9h17M12 2.5 8.5 9l3.5 12.5M12 2.5 15.5 9 12 21.5" fill="none" stroke="#0E1419" stroke-width="1.1" stroke-linejoin="round"></path></svg>
      <div class="meta">
        <div class="labelrow">
          <div class="label" style="color:#7FD8F7">DIAMOND</div>
          <div class="pill">ELITE</div>
        </div>
        <div class="num">1000+</div>
        <div class="unit">METERS PER DAY</div>
      </div>
      <div class="amt">&#8377;800</div>
    </div>

    <div class="tier" style="border-left:6px solid #FFC20E;background:linear-gradient(90deg,rgba(255,194,14,0.07),rgba(255,194,14,0))">
      <svg width="76" height="76" viewBox="0 0 24 24" aria-hidden="true" style="flex:none"><path d="m12 2.8 2.7 5.9 6.4.8-4.7 4.4 1.2 6.3L12 17.1l-5.6 3.1 1.2-6.3L2.9 9.5l6.4-.8z" fill="#FFC20E"></path></svg>
      <div class="meta">
        <div class="label" style="color:#FFC20E">GOLD</div>
        <div class="num">700+</div>
        <div class="unit">METERS PER DAY</div>
      </div>
      <div class="amt">&#8377;500</div>
    </div>

    <div class="tier" style="border-left:6px solid #8D99A8">
      <svg width="76" height="76" viewBox="0 0 24 24" aria-hidden="true" style="flex:none"><circle cx="12" cy="12" r="8.6" fill="none" stroke="#C3CBD6" stroke-width="2.2"></circle><circle cx="12" cy="12" r="3.4" fill="#C3CBD6"></circle></svg>
      <div class="meta">
        <div class="label" style="color:#C3CBD6">SILVER</div>
        <div class="num">600+</div>
        <div class="unit">METERS PER DAY</div>
      </div>
      <div class="amt">&#8377;300</div>
    </div>

  </div>

  <div class="foot">Meters count only for inspected, incident-free work.</div>

</div>
</div>

<script>
/* Scale the fixed 1080px artwork down to the window, so the poster is readable
   on a phone. The exported PNG is always the full 1080 x 1350. */
(function () {
  function fit() {
    var scaler = document.getElementById("scaler");
    var board = document.getElementById("board");
    var k = Math.min(1, scaler.clientWidth / 1080);
    board.style.transform = "scale(" + k + ")";
    scaler.style.height = Math.round(1350 * k) + "px";
  }
  window.addEventListener("resize", fit);
  fit();
})();
</script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Daily Booster Studio</title>
<meta name="robots" content="noindex">
<script>
/* Short links. GitHub Pages serves this page for any path it has no file for,
   so /podium and /W1 both land here and are sent on to that template. The
   studio resolves either a template id or a creative code; anything else ends
   up on the home screen. */
(function () {
  var clean = location.pathname.replace(/\/+$/, "");
  var cut = clean.lastIndexOf("/");
  var id = clean.slice(cut + 1);
  var base = clean.slice(0, cut + 1);
  if (base !== "/" && /^[A-Za-z0-9-]{1,40}$/.test(id) && id !== "404.html") {
    location.replace(base + "studio.html?t=" + encodeURIComponent(id));
  } else {
    location.replace(base);
  }
})();
</script>
</head>
<body>
<p>Taking you to the studio. <a href="./">Open the home screen</a> if nothing happens.</p>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Studio — Daily Booster</title>
<meta name="robots" content="noindex">
<link rel="icon" href="assets/beckhaul-logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo:wght@400;500;600;700&family=Archivo+Black&family=Barlow+Condensed:wght@500;600;700;800&display=swap">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#FFC42E">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Booster">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="wrap">

  <p class="backlink"><a href="index.html">&larr; All templates</a></p>

  <div id="missing" hidden>
    <h1>That template is not here</h1>
    <p class="sub">The link may be out of date. <a href="index.html">Pick a template</a> from the home screen.</p>
  </div>

  <div id="studio">
    <header class="pagehead">
      <h1 id="tname">Studio</h1>
      <p class="sub" id="tdesc"></p>
      <p class="partnerline" id="partnerline" hidden>Goes with <a id="partner" href="#"></a></p>
    </header>

    <div class="cols">
      <div>
        <div class="banner" id="examplebanner">
          <div>Loaded with example crews so you can see the board. <button type="button" id="clearexamples">Clear them</button></div>
        </div>

        <section class="card">
          <h2>Details</h2>
          <div id="fields" class="fieldgrid"></div>
        </section>

        <section class="card" id="rowcard" hidden>
          <h2>Rows</h2>
          <div class="grid-head" id="gridhead"></div>
          <div id="rows"></div>
          <div class="btn-row">
            <button type="button" class="btn" id="addrow">Add row</button>
            <button type="button" class="btn" id="sortrows">Sort by meters</button>
          </div>
          <p class="note" id="rownote"></p>
        </section>

        <section class="card">
          <h2>Tiers on this board</h2>
          <div id="tiers"></div>
          <p class="note" id="tiernote"></p>
          <div class="btn-row">
            <button type="button" class="btn" id="tierreset" hidden>Back to the defaults</button>
          </div>
        </section>
      </div>

      <div class="previewcol">
        <div class="stage" id="stage"><div id="board"></div></div>
        <div class="btn-row">
          <button type="button" class="btn btn-primary" id="download">Download PNG</button>
        </div>
        <p class="status" id="status"></p>
      </div>
    </div>
  </div>

  <footer class="pagefoot">
    <p>What you type stays in this browser. Nothing is uploaded or committed.</p>
  </footer>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="core.js"></script>
<script src="templates/winners.js"></script>
<script src="templates/rewards.js"></script>
<script src="templates/podium.js"></script>
<script src="templates/win.js"></script>
<script src="templates/simple-winners.js"></script>
<script src="templates/simple-rewards.js"></script>
<script src="studio.js"></script>
<script>
/* Register the service worker so the studio can be installed to a home screen
   and still opens on a bad site connection. */
if ("serviceWorker" in navigator) {
  window.addEventListener("load", function () {
    navigator.serviceWorker.register("sw.js").catch(function () { /* fine without it */ });
  });
}
</script>
</body>
</html>
